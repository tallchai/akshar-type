sources:
  - Akshar.glyphs
outputDir: "../fonts"
buildStatic: true
buildVariable: true
buildTTF: true
buildOTF: false
buildWebfont: false
stat:
  - name: Weight
    tag: wght
    values:
      - name: Light
        value: 300
      - name: Regular
        value: 400
        flags: 2
        linkedValue: 700
      - name: Medium
        value: 500
      - name: SemiBold
        value: 600
      - name: Bold
        value: 700
  - name: Contrast
    tag: CTRS
    values:
      - name: None
        value: 0
        flags: 2
      - name: High
        value: 100
